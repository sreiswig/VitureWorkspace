name: hello_flutter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Public-repo free tier only (ubuntu-latest). No paid GHAS / larger runners.
permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hello_flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true # caches the Flutter SDK and pub cache
      - name: flutter --version
        run: flutter --version
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test
