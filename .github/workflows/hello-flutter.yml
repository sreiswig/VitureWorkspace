name: hello_flutter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Public-repo free tier only (GitHub-hosted ubuntu-24.04, pinned). No paid GHAS / larger runners.
permissions:
  contents: read

# Cancel superseded pull_request runs; push runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flutter:
    runs-on: ubuntu-24.04
    # Caps hung steps once a runner picks the job up (~1-1.5 min observed incl. Flutter SDK setup; 20 min headroom).
    # Does NOT bound time spent queued waiting for a runner.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hello_flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true # caches the Flutter SDK and pub cache
      - name: flutter --version
        run: flutter --version
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test
