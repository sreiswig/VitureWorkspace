# Free-tier CycloneDX SBOM via Syft (anchore/sbom-action)
# plus Grype vuln scan of that SBOM.
# Artifact only — do not commit generated SBOM / Grype blobs.
# No paid GHAS / Dependency Review / code-scanning SARIF upload.
# dependency-snapshot left false.
name: SBOM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    # Weekly: Monday 09:00 America/Chicago (14:00 UTC while CDT)
    - cron: "0 14 * * 1"

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: true
          upload-artifact-retention: "30"
          upload-release-assets: true
          dependency-snapshot: false

      - name: Scan CycloneDX SBOM (Grype)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cyclonedx.json
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: grype.json
          cache-db: true

      - name: Upload Grype report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-report
          path: grype.json
          retention-days: 30
