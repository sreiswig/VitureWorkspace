name: hello_viture

on:
  push:
    branches: [main]
    paths:
      - "hello_viture/**"
      - "Viture/Linux_x86_64/**"
      - ".github/workflows/hello-viture.yml"
  pull_request:
    branches: [main]
    paths:
      - "hello_viture/**"
      - "Viture/Linux_x86_64/**"
      - ".github/workflows/hello-viture.yml"

# Public-repo free tier only (GitHub-hosted ubuntu-24.04, pinned). No paid GHAS / larger runners.
# Compile and link the tracked SDK tree. Do not download the proprietary SDK, and do not run the binary (no glasses in CI).
permissions:
  contents: read

# Cancel superseded pull_request runs; push runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile:
    runs-on: ubuntu-24.04
    # Caps hung steps once a runner picks the job up (local cmake build ~1s; 10 min headroom).
    # Does NOT bound time spent queued waiting for a runner.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure and build
        run: |
          cmake -S hello_viture -B build
          cmake --build build

      - name: Sanity-check the linked binary
        run: |
          set -euo pipefail
          file build/hello_viture
          # Static DT_NEEDED read only. Do not run ldd: a crafted ELF can
          # execute loader code. Do not execute build/hello_viture or any SDK
          # binary, and do not set LD_LIBRARY_PATH.
          # libglasses.so has DT_RUNPATH=$ORIGIN, so libcarina_vio.so sits beside
          # it. libcarina_vio.so has no RUNPATH; its OpenCV 4.2 NEEDED sonames
          # still have to be present in the SDK lib dir. Link does not need
          # them on the command line.
          echo "--- NEEDED (readelf -d) ---"
          readelf -d build/hello_viture | grep NEEDED
          sdk="Viture/Linux_x86_64/release/x86_64"
          # Fail closed. Each soname must exist under $sdk (test -f) and be
          # listed as DT_NEEDED on the executable or the SDK object that
          # requests it (readelf -d only).
          require_sdk_lib() {
            local name="$1"
            local provider="$2"
            if ! test -f "${sdk}/${name}"; then
              echo "::error::SDK library missing from ${sdk}: ${name}"
              exit 1
            fi
            local dynamic
            if ! dynamic="$(readelf -d "${provider}")"; then
              echo "::error::readelf -d failed for ${provider} while checking ${name}"
              exit 1
            fi
            if ! grep NEEDED <<<"${dynamic}" | grep -F -q "[${name}]"; then
              echo "::error::SDK library not listed as DT_NEEDED or not resolvable via readelf: ${name} (provider ${provider})"
              exit 1
            fi
          }
          require_sdk_lib libglasses.so build/hello_viture
          require_sdk_lib libcarina_vio.so "${sdk}/libglasses.so"
          require_sdk_lib libopencv_core.so.4.2 "${sdk}/libcarina_vio.so"
