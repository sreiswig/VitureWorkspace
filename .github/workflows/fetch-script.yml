name: fetch-script fail-closed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Public-repo free tier only. Never download the proprietary Viture SDK.
jobs:
  fail-closed:
    runs-on: ubuntu-latest
    env:
      CI_NO_FETCH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax-check fetch-viture-sdk.sh
        run: bash -n scripts/fetch-viture-sdk.sh
      - name: Fail-closed fetch-script tests (no SDK download)
        run: bash tests/test-fetch-viture-sdk.sh
