name: fetch-script fail-closed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Public-repo free tier only. Never download the proprietary Viture SDK.
permissions:
  contents: read

# Cancel superseded pull_request runs; push runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fail-closed:
    runs-on: ubuntu-24.04
    # Caps hung steps once a runner picks the job up (~15s observed; 10 min headroom).
    # Does NOT bound time spent queued waiting for a runner.
    timeout-minutes: 10
    env:
      CI_NO_FETCH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax-check fetch scripts
        run: |
          bash -n scripts/fetch-viture-sdk.sh
          bash -n scripts/lib/sdk-fetch-policy.sh
      - name: In-memory SDK fetch policy tests
        run: bash tests/test-sdk-fetch-policy.sh
      - name: Fail-closed fetch-script tests (no SDK download)
        run: bash tests/test-fetch-viture-sdk.sh
